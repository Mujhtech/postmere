[workspace]
members = [".", "crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = { version = "0.6.0", features = ["getrandom", "zeroize"] }
axum = { version = "0.8.9", features = ["json", "http1", "tokio"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.4"
getrandom = "0.4.3"
futures-util = "0.3.34"
mailparse = "0.16"
# Newer mail-auth releases require Rust 1.98 through mail-parser 1.x.
mail-auth = { version = "=0.13.3", default-features = false, features = ["ring"] }
html-escape = "0.2"
hmac = "0.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query", "stream", "http2"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
ring = "0.17"
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["limit", "timeout", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }
http-body-util = "0.1"
postmere-core = { path = "crates/postmere-core" }
postmere-providers = { path = "crates/postmere-providers" }
postmere-tracking = { path = "crates/postmere-tracking" }
postmere-mail = { path = "crates/postmere-mail" }
postmere-calendar = { path = "crates/postmere-calendar" }
postmere-collaboration = { path = "crates/postmere-collaboration" }
postmere-ai = { path = "crates/postmere-ai" }
postmere-unsubscribe = { path = "crates/postmere-unsubscribe" }
postmere-mcp-auth = { path = "crates/postmere-mcp-auth" }
postmere-mcp-operations = { path = "crates/postmere-mcp-operations" }
postmere-mcp = { path = "crates/postmere-mcp" }
postmere-realtime = { path = "crates/postmere-realtime" }
postmere-push = { path = "crates/postmere-push" }
postmere-webhooks = { path = "crates/postmere-webhooks" }

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "postmere-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
postmere-core.workspace = true
postmere-tracking.workspace = true
postmere-mail.workspace = true
postmere-calendar.workspace = true
postmere-collaboration.workspace = true
postmere-ai.workspace = true
postmere-unsubscribe.workspace = true
postmere-mcp.workspace = true
postmere-mcp-auth.workspace = true
postmere-realtime.workspace = true
postmere-push.workspace = true
postmere-webhooks.workspace = true
axum.workspace = true
serde.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
ring.workspace = true
postmere-providers.workspace = true
postmere-mcp-operations.workspace = true
base64.workspace = true
chrono.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sha2.workspace = true
tower.workspace = true
url.workspace = true

[lints]
workspace = true

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
