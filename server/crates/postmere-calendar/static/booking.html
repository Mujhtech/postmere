<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Meet with Postmere</title>
  <link rel="stylesheet" href="/calendar-booking.css">
  <script src="/calendar-booking.js" defer></script>
</head>
<body>
  <header><a class="wordmark" href="#main" aria-label="Postmere, skip to booking">postmere<span aria-hidden="true">.</span></a></header>
  <main id="main">
    <section class="intro" aria-labelledby="title">
      <h1 id="title">Book a meeting</h1>
      <p id="description" class="description" hidden></p>
      <div id="details" class="details" hidden><span id="duration"></span><span id="host-zone"></span></div>
      <p id="availability-note" class="note">Availability is checked again when you book. You'll receive an invitation from the host's calendar.</p>
      <div class="illustration" aria-hidden="true"><span class="page one"></span><span class="page two"></span><span class="leaf"></span></div>
    </section>
    <section class="booking" aria-label="Meeting booking">
      <div id="availability-heading" class="step-heading"><h2>Choose a time</h2><button id="refresh" class="text-button" type="button" hidden>Refresh</button></div>
      <p id="zone" class="muted"></p>
      <div id="status" class="status" role="status" aria-live="polite">Checking availability…</div>
      <div id="slots" class="slots" role="group" aria-label="Available meeting times"></div>
      <form id="booking-form" hidden>
        <h2>Your details</h2>
        <p id="selection" class="selection"></p>
        <label for="name">Name</label><input id="name" name="name" autocomplete="name" maxlength="120" required>
        <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <p class="privacy">Your name and email will be shared with the host to create this meeting.</p>
        <button id="submit" class="primary" type="submit"><span id="submit-label">Confirm meeting</span><span aria-hidden="true">↗</span></button>
      </form>
      <div id="confirmation" class="confirmation" hidden>
        <span id="confirmation-mark" class="confirmation-mark" aria-hidden="true">✓</span>
        <h2 id="confirmation-title" tabindex="-1"></h2>
        <p id="confirmation-message"></p><p id="confirmation-time"></p>
      </div>
    </section>
  </main>
</body>
</html>
